<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Settings | CardVector</title><link rel="stylesheet" href="/account/style.css?cv=e449c450eed6"><link rel="stylesheet" href="/dashboard/style.css?cv=e449c450eed6"><link rel="stylesheet" href="/settings/style.css?cv=e449c450eed6"></head><body><header class="top"><a href="/" class="brand"><img src="/assets/cardvector-twin-arrow.svg?cv=e449c450eed6" alt="CardVector" width="210" height="42"></a><nav class="app-nav"><a href="/dashboard/">Dashboard</a><a href="/wanted/">Find cards</a><a href="/settings/" aria-current="page">Settings</a></nav></header><main class="settings-shell"><p class="eyebrow">ACCOUNT</p><h1>Settings</h1><p class="hint">Manage your collector identity and account security.</p><section class="panel"><h2>Collector profile</h2><form id="profile-form"><label for="display-name">Display name</label><input id="display-name" maxlength="60" required autocomplete="nickname"><label for="favorite-tcg">Favorite trading card game</label><select id="favorite-tcg"><option value="">Choose one (optional)</option><option>Pokémon</option><option>Magic: The Gathering</option><option>Yu-Gi-Oh!</option><option>One Piece</option><option>Other</option></select><button type="submit" class="primary">Save profile</button></form></section><section class="panel"><h2>Email address</h2><p id="current-email" class="hint"></p><form id="email-form"><label for="new-email">New email address</label><input id="new-email" type="email" autocomplete="email" maxlength="254" required><button type="submit" class="primary">Request email change</button><p class="hint">For your security, Supabase may require confirmation from your existing and new email addresses.</p></form></section><section class="panel"><h2>Password</h2><form id="password-form"><label for="new-password">New password</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required><button type="submit" class="primary">Update password</button></form></section><section class="panel"><h2>Session</h2><button type="button" id="sign-out" class="secondary">Sign out</button></section><p id="status" class="status" role="status" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="/settings/app.js?cv=e449c450eed6" defer></script></body></html>
